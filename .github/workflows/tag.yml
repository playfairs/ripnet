name: Build dev tag

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-build:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          output="$(nix build .#default --no-link --print-out-paths)"
          test -x "$output/bin/ripnet"
          test "$("$output/bin/ripnet" --version)" = "ripnet $version"
          mkdir -p dist
          cp "$output/bin/ripnet" "dist/ripnet-v${version}-linux-x86_64"
          test -x "dist/ripnet-v${version}-linux-x86_64"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/ripnet-v*-linux-x86_64
          if-no-files-found: error

  macos-build:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          output="$(nix build .#default --no-link --print-out-paths)"
          test -x "$output/bin/ripnet"
          test "$($output/bin/ripnet --version)" = "ripnet $version"
          mkdir -p dist
          cp "$output/bin/ripnet" "dist/ripnet-v${version}-macos-arm64"
          test -x "dist/ripnet-v${version}-macos-arm64"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/ripnet-v*-macos-arm64
          if-no-files-found: error

  dev-tag:
    name: Publish dev build
    needs:
      - linux-build
      - macos-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ripnet-dev-tags
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist/linux-x86_64

      - name: Download macOS executable
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist/macos-arm64

      - name: Verify dev executables
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          linux_asset="dist/linux-x86_64/ripnet-v${version}-linux-x86_64"
          macos_asset="dist/macos-arm64/ripnet-v${version}-macos-arm64"
          test -f "$linux_asset"
          test -f "$macos_asset"
          chmod +x "$linux_asset" "$macos_asset"
          test -x "$linux_asset"
          test -x "$macos_asset"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Create numbered dev tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          last_number="$(git tag --list 'ripnet-dev.*' \
            | sed -nE 's/^ripnet-dev\.([0-9]+)$/\1/p' \
            | sort -n \
            | tail -n 1)"
          next_number=0
          if [[ -n "$last_number" ]]; then
            next_number=$((last_number + 1))
          fi
          tag="ripnet-dev.${next_number}"
          while git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; do
            next_number=$((next_number + 1))
            tag="ripnet-dev.${next_number}"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" "$GITHUB_SHA" \
            -m "Dev build ${tag}" \
            -m "Install the downloaded executable with: chmod +x <file> && sudo install -m 755 <file> /usr/local/bin/ripnet"
          git push origin "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Publish dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: true
          body: |
            Download the executable for your platform, then run:

            ```sh
            chmod +x ripnet-v${{ steps.verify.outputs.version }}-linux-x86_64
            sudo install -m 755 ripnet-v${{ steps.verify.outputs.version }}-linux-x86_64 /usr/local/bin/ripnet
            ```

            or for macOS:

            ```sh
            chmod +x ripnet-v${{ steps.verify.outputs.version }}-macos-arm64
            sudo install -m 755 ripnet-v${{ steps.verify.outputs.version }}-macos-arm64 /usr/local/bin/ripnet
            ```
          files: |
            dist/linux-x86_64/ripnet-v${{ steps.verify.outputs.version }}-linux-x86_64
            dist/macos-arm64/ripnet-v${{ steps.verify.outputs.version }}-macos-arm64
